name: Apply patches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'node.js-*.patch'
      - 'python-*.patch'

permissions:
  contents: write

concurrency:
  group: apply-patches
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patches
        run: |
          set -euo pipefail
          mkdir -p patches/applied
          apply_dir() {
            dir="$1"; shift
            for p in "$@"; do
              [ -e "$p" ] || continue
              if git apply --reverse --check --directory="$dir" "$p" 2>/dev/null; then
                echo "Already applied, skipping: $p"
              else
                git apply --check --directory="$dir" "$p"   # fails the job on a conflict
                git apply --directory="$dir" "$p"
                echo "Applied: $p -> $dir/"
              fi
              git mv -f "$p" "patches/applied/$(date +%Y%m%d-%H%M%S)-$(basename "$p")"
            done
          }
          apply_dir node.js node.js-*.patch
          apply_dir python python-*.patch

      - name: Syntax check
        run: |
          set -euo pipefail
          for f in node.js/lib/chain.js node.js/lib/server.js; do
            if [ -f "$f" ]; then node --check "$f"; fi
          done
          if [ -f python/node.py ]; then
            python -c "import ast; ast.parse(open('python/node.py').read())"
          fi

      - name: Commit and push
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply patches"
          git push origin HEAD
